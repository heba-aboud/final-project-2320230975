<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الوصفات · وصفات</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- ===== HEADER ===== -->
    <header>
        <nav class="navbar" aria-label="القائمة الرئيسية">
            <div class="logo">وصفات <span>•</span></div>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="recipes.html" class="active" aria-current="page">الوصفات</a></li>
                <li><a href="contact.html">تواصل</a></li>
                <li><a href="about.html">من نحن</a></li>
            </ul>
            <div class="hamburger" id="hamburger" aria-label="فتح القائمة" role="button" tabindex="0">
                <span></span><span></span><span></span>
            </div>
        </nav>
    </header>

    <!-- ===== MAIN ===== -->
    <main>
        <div class="container">
            <h1 class="page-title">جميع الوصفات</h1>

            <!-- البحث والفلترة -->
            <div class="search-filter">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="ابحث عن وصفة..." aria-label="بحث">
                    <button type="button" aria-label="بحث"><i class="fas fa-search"></i></button>
                </div>
                <div class="filter-group" id="filterGroup">
                    <button class="filter-btn active" data-filter="all">الكل</button>
                    <button class="filter-btn" data-filter="الوجبات الرئيسية">الوجبات الرئيسية</button>
                    <button class="filter-btn" data-filter="المقبلات">المقبلات</button>
                    <button class="filter-btn" data-filter="الحلويات">الحلويات</button>
                </div>
            </div>

            <!-- شبكة الوصفات -->
            <div class="recipes-grid" id="allRecipes"></div>
        </div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer>
        <p>© 2026 وصفات · جميع الحقوق محفوظة</p>
        <div class="social-links">
            <a href="#" aria-label="فيسبوك"><i class="fab fa-facebook"></i></a>
            <a href="#" aria-label="إنستغرام"><i class="fab fa-instagram"></i></a>
            <a href="#" aria-label="تويتر"><i class="fab fa-x-twitter"></i></a>
            <a href="#" aria-label="يوتيوب"><i class="fab fa-youtube"></i></a>
        </div>
        <p class="footer-tagline">المطبخ الشرقي بنكهة عصرية</p>
    </footer>

    <!-- ===== BACK TO TOP ===== -->
    <button id="backTop" aria-label="العودة للأعلى"><i class="fas fa-chevron-up"></i></button>

    <!-- ===== MODAL ===== -->
    <div class="modal-overlay" id="recipeModal">
        <div class="modal-box" id="modalContent">
            <button class="modal-close" id="modalClose" aria-label="إغلاق">✕</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- ===== JAVASCRIPT ===== -->
    <script src="js/script.js"></script>
</body>

</html>
